<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="mycards.css" />
    <style>

      .card-container {
        display: inline-block;
        position: relative;
        width: 200px; /* Adjust card size */
        height: 280px;
        perspective: 1000px; /* Enables 3D flipping */
        cursor: pointer;
      }

      .card {
        width: 100%;
        height: 100%;
        position: absolute;
        transform-style: preserve-3d;
        transition: transform 0.6s;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card .front,
      .card .back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
      }

      .card .back {
        transform: rotateY(180deg);
      }

      .enlarged {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 350px;
        height: 500px;
        transform: translate(-50%, -50%) scale(1.2);
        z-index: 1000;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      }

  
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        z-index: 900;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="my-cards">
      <div class="overlap-wrapper">
        <div class="overlap">
          <div class="my-cards-wrapper">
            <div class="div">
              <div class="overlap-group">
                <div class="overlap-2">
                  <div class="text-wrapper">My Cards</div>
                  <img class="vector" src="Images/back-arrow.svg" />
                </div>
                <div class="overlap-group">
                  <div class="frame"></div>
                  <a href="home.html"><img class="image" src="Images/draftdecklogo2.png" alt="Go to Home"/></a>

                  <!-- Trading Cards with Click Events -->
                  <div class="card-container" onclick="toggleCard(this)">
                    <div class="card">
                      <img class="front" src="Images/TradingCards/Lamar.png" />
                      <img class="back" src="Images/TradingCards/Lamar_Back.png" />
                    </div>
                  </div>

                  <div class="card-container" onclick="toggleCard(this)">
                    <div class="card">
                      <img class="front" src="Images/TradingCards/Kamara_Card.png" />
                      <img class="back" src="Images/TradingCards/Kamara_Back.png" />
                    </div>
                  </div>

                  <div class="card-container" onclick="toggleCard(this)">
                    <div class="card">
                      <img class="front" src="Images/TradingCards/Saquon_Card.png" />
                      <img class="back" src="Images/TradingCards/Saquon_Back.png" />
                    </div>
                  </div>
                </div>
              </div>

              <div class="overlap-3">
                <div class="card-container" onclick="toggleCard(this)">
                  <div class="card">
                    <img class="front" src="Images/TradingCards/Mahomes_card.png" />
                    <img class="back" src="Images/TradingCards/Mahomes_Back.png" />
                  </div>
                </div>

                <div class="card-container" onclick="toggleCard(this)">
                  <div class="card">
                    <img class="front" src="Images/TradingCards/Jamarr_Card.png" />
                    <img class="back" src="Images/TradingCards/Jamarr_Back.png" />
                  </div>
                </div>
              </div>
            </div>
          </div>

     
          <div class="overlay" id="overlay" onclick="closeCard()"></div>

          <div class="menu-bar">
            <img class="menu-img" src="Images/hamburger_menu.png" />
          </div>
        </div>
      </div>
    </div>

    <script>
      let enlargedCard = null;

      function toggleCard(cardContainer) {
        const card = cardContainer.querySelector(".card");

        if (cardContainer.classList.contains("enlarged")) {
          card.classList.toggle("flipped");
    
          if (enlargedCard) {
            closeCard();
          }

          cardContainer.classList.add("enlarged");
          document.getElementById("overlay").style.display = "block";
          enlargedCard = cardContainer;
        }
      }

      function closeCard() {
        if (enlargedCard) {
          enlargedCard.classList.remove("enlarged");
          enlargedCard.querySelector(".card").classList.remove("flipped");
          document.getElementById("overlay").style.display = "none";
          enlargedCard = null;
        }
      }

      // Close enlarged card when clicking outside
      document.getElementById("overlay").addEventListener("click", closeCard);
    </script>
  </body>
</html>
